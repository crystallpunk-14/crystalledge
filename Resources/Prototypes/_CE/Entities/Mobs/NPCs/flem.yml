- type: entity
  parent:
  - BaseMob
  - MobFlammable
  - CEMobDamageable
  - CEMobCombat
  id: CEFlem
  name: flem
  description: TODO
  categories: [ ForkFiltered ]
  components:
  - type: CEGOAP
    planCooldown: 0.5
    goals:
    - desiredState:
        CEEnemyNeutralized: true
      activationConditions:
        CELowHealth: false
        CEEnemyVisible: true
      priority: 1
    - desiredState:
        CEEnemyVisible: false
      activationConditions:
        CELowHealth: true
        CEEnemyVisible: true
      priority: 2
    actions:
    - !type:CEGOAPMoveToTargetAction
      preconditions:
        CEEnemyVisible: true
      effects:
        CEEnemyInMeleeRange: true
      cost: 2
      range: 1.5
    - !type:CEGOAPMeleeAttackAction
      preconditions:
        CEEnemyInMeleeRange: true
      effects:
        CEEnemyNeutralized: true
      cost: 1
      useType: Primary
      angleVariation: 5
    - !type:CEGOAPFleeAction
      preconditions:
        CELowHealth: true
        CEEnemyVisible: true
      effects:
        CEEnemyVisible: false
      cost: 1
      fleeDistance: 15
    sensors:
    - !type:CEGOAPFindEnemySensor
      conditionKey: CEEnemyVisible
      visionRadius: 10
    - !type:CEGOAPHealthSensor
      conditionKey: CELowHealth
      threshold: 0.5
    - !type:CEGOAPEnemyRangeSensor
      conditionKey: CEEnemyInMeleeRange
      range: 1.5
    - !type:CEGOAPEnemyStateSensor
      conditionKey: CEEnemyNeutralized
  - type: NpcFactionMember
    factions:
    - SimpleHostile
  - type: Sprite
    drawdepth: Mobs
    sprite: _CE/Mobs/flem.rsi
    layers:
    - map: [ "livingState" ]
      state: alive
  - type: GenericVisualizer
    visuals:
      enum.CEHealthState.State:
        livingState:
          Alive: { state: alive }
          Critical: { state: dead }
          Dead: { state: dead }
  - type: MovementAlwaysTouching
  - type: MovementSpeedModifier
    baseWalkSpeed: 1
    baseSprintSpeed: 1.5
  - type: CEWeapon
    spriteRotation: -90
    damage:
      types:
        Physical: 2
    animations:
      Primary:
      - anim: FlemAttack1
      - anim: FlemAttack2

- type: animationAction
  id: FlemAttack1
  movementSpeed: 0.5
  duration: 0.8
  events:
    0:
    - !type:PlaySound
      sound:
        path: /Audio/_CE/Effects/Weapon/slash_sword2.ogg
    - !type:EntityAnimation
      spriteOverride:
        sprite: _CE/Objects/Weapons/Skimitar/iron.rsi
        state: icon
      offsetAnimation:
      - time: 0.0
        offset: -0.1, -0.2
        easing: QuadIn
      - time: 0.05
        offset: -0.2, -0.0
      - time: 0.1
        offset: -0.3, -0.2
      - time: 0.2
        offset: -0.2, -1.2
        easing: QuadIn
      - time: 0.3
        offset: 0.1, -0.5
        easing: QuadOut

      rotationAnimation:
      - time: 0.0
        rotation: 20
      - time: 0.02
        rotation: 90
      - time: 0.07
        rotation: 180
      - time: 0.1
        rotation: 270
      - time: 0.2
        rotation: 360
      - time: 0.2
        rotation: 400

      colorAnimation:
      - time: 0.3
        color: "#ffffff"
      - time: 0.4
        color: "#ffffff00"  # Fade out
        easing: QuadOut

      scaleAnimation:
      - time: 0.0
        scale: 1, -1
    0.25:
    - !type:WeaponArcAttack
      range: 0.7
      arcWidth: 40
    - !type:Dash
      distance: 0.1

- type: animationAction
  id: FlemAttack2
  movementSpeed: 0.5
  duration: 0.8
  events:
    0:
    - !type:PlaySound
      sound:
        path: /Audio/_CE/Effects/Weapon/slash_sword2.ogg
    - !type:EntityAnimation
      spriteOverride:
        sprite: _CE/Objects/Weapons/Skimitar/iron.rsi
        state: icon
      offsetAnimation:
      - time: 0.0
        offset: 0.1, -0.2
        easing: QuadIn
      - time: 0.05
        offset: 0.2, -0.0
      - time: 0.1
        offset: 0.3, -0.2
      - time: 0.2
        offset: 0.2, -1.2
        easing: QuadIn
      - time: 0.3
        offset: -0.1, -0.5
        easing: QuadOut

      rotationAnimation:
      - time: 0.0
        rotation: -20
      - time: 0.02
        rotation: -90
      - time: 0.07
        rotation: -180
      - time: 0.1
        rotation: -270
      - time: 0.2
        rotation: -360
      - time: 0.2
        rotation: -400

      colorAnimation:
      - time: 0.3
        color: "#ffffff"
      - time: 0.4
        color: "#ffffff00"  # Fade out
        easing: QuadOut

      scaleAnimation:
      - time: 0.0
        scale: 1, 1
    0.25:
    - !type:WeaponArcAttack
      range: 0.7
      arcWidth: 40
    - !type:Dash
      distance: 0.1
