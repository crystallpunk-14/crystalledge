- type: entity
  parent:
  - BaseMob
  - MobFlammable
  - CEMobDamageable
  - CEMobCombat
  id: CEFlem
  name: flem
  description: TODO
  categories: [ ForkFiltered ]
  components:
  - type: CEMagicEnergyContainer
    maxEnergy: 100
  - type: CEGOAP
    planCooldown: 0.5

    goals:
    # Buff self
    - desiredState:
        CEHasDivineShield: true
      activationConditions:
        CEHasDivineShield: false
        CEEnemyVisible: true
      priority: 4
    # First - attack
    - desiredState:
        CEEnemyNeutralized: true
      activationConditions:
        CELowHealth: false
        CEEnemyVisible: true
      priority: 3
    # Second - run away
    - desiredState:
        CEEnemyVisible: false
      activationConditions:
        CELowHealth: true
        CEEnemyVisible: true
      priority: 2
    # Last - healing
    - desiredState:
        CELowHealth: false
      activationConditions:
        CELowHealth: true
        CEEnemyVisible: false
      priority: 1

    actions:
    # Move to target
    - !type:CEGOAPMoveToTargetAction
      preconditions:
        CEEnemyVisible: true
      effects:
        CEEnemyInMeleeRange: true
      cost: 2
      range: 1.5
    # Attack target
    - !type:CEGOAPMeleeAttackAction
      preconditions:
        CEEnemyInMeleeRange: true
      effects:
        CEEnemyNeutralized: true
      cost: 1
      useType: Primary
      angleVariation: 5
    # Run away from target
    - !type:CEGOAPFleeAction
      preconditions:
        CELowHealth: true
        CEEnemyVisible: true
      effects:
        CEEnemyVisible: false
      cost: 1
      fleeDistance: 15
    # Divine Shield - self-target entity action, use when no shield active
    - !type:CEGOAPUseEntityTargetAction
      preconditions:
        CEHasDivineShield: false
      effects:
        CEHasDivineShield: true
      cost: 1
      actionPrototype: CEActionSpellDivineShield
      targetSelf: true
    # Intellect Buff - instant action, use when chasing and no buff
    - !type:CEGOAPUseInstantAction
      preconditions:
        CEHasIntellectBuff: false
      effects:
        CEHasIntellectBuff: true
      cost: 1
      actionPrototype: CEActionMageIntellectBuff
    # Area Healing - world target under self, use when low health
    - !type:CEGOAPUseWorldTargetAction
      preconditions:
        CELowHealth: true
      effects:
        CELowHealth: false
      cost: 2
      actionPrototype: CEActionSpellAreaHealing
      targetSelf: true

    sensors:
    - !type:CEGOAPFindEnemySensor
      conditionKey: CEEnemyVisible
      visionRadius: 10
    - !type:CEGOAPHealthSensor
      conditionKey: CELowHealth
      threshold: 0.5
    - !type:CEGOAPEnemyRangeSensor
      conditionKey: CEEnemyInMeleeRange
      range: 1.5
    - !type:CEGOAPEnemyStateSensor
      conditionKey: CEEnemyNeutralized
    - !type:CEGOAPHasStatusEffectSensor
      conditionKey: CEHasDivineShield
      statusEffect: CEStatusEffectDivineShield
    - !type:CEGOAPHasStatusEffectSensor
      conditionKey: CEHasIntellectBuff
      statusEffect: CEStatusEffectMageIntellectBuff
  - type: NpcFactionMember
    factions:
    - SimpleHostile
  - type: Sprite
    drawdepth: Mobs
    sprite: _CE/Mobs/flem.rsi
    layers:
    - map: [ "livingState" ]
      state: alive
  - type: GenericVisualizer
    visuals:
      enum.CEHealthState.State:
        livingState:
          Alive: { state: alive }
          Critical: { state: dead }
          Dead: { state: dead }
  - type: MovementAlwaysTouching
  - type: MovementSpeedModifier
    baseWalkSpeed: 1
    baseSprintSpeed: 1.5
  - type: CEWeapon
    spriteRotation: -90
    damage:
      types:
        Physical: 2
    animations:
      Primary:
      - anim: FlemAttack1
      - anim: FlemAttack2

- type: animationAction
  id: FlemAttack1
  movementSpeed: 0.5
  duration: 0.8
  events:
    0:
    - !type:PlaySound
      sound:
        path: /Audio/_CE/Effects/Weapon/slash_sword2.ogg
    - !type:EntityAnimation
      spriteOverride:
        sprite: _CE/Objects/Weapons/Skimitar/iron.rsi
        state: icon
      offsetAnimation:
      - time: 0.0
        offset: -0.1, -0.2
        easing: QuadIn
      - time: 0.05
        offset: -0.2, -0.0
      - time: 0.1
        offset: -0.3, -0.2
      - time: 0.2
        offset: -0.2, -1.2
        easing: QuadIn
      - time: 0.3
        offset: 0.1, -0.5
        easing: QuadOut

      rotationAnimation:
      - time: 0.0
        rotation: 20
      - time: 0.02
        rotation: 90
      - time: 0.07
        rotation: 180
      - time: 0.1
        rotation: 270
      - time: 0.2
        rotation: 360
      - time: 0.2
        rotation: 400

      colorAnimation:
      - time: 0.3
        color: "#ffffff"
      - time: 0.4
        color: "#ffffff00"  # Fade out
        easing: QuadOut

      scaleAnimation:
      - time: 0.0
        scale: 1, -1
    0.25:
    - !type:WeaponArcAttack
      range: 0.7
      arcWidth: 40
    - !type:Dash
      distance: 0.1

- type: animationAction
  id: FlemAttack2
  movementSpeed: 0.5
  duration: 0.8
  events:
    0:
    - !type:PlaySound
      sound:
        path: /Audio/_CE/Effects/Weapon/slash_sword2.ogg
    - !type:EntityAnimation
      spriteOverride:
        sprite: _CE/Objects/Weapons/Skimitar/iron.rsi
        state: icon
      offsetAnimation:
      - time: 0.0
        offset: 0.1, -0.2
        easing: QuadIn
      - time: 0.05
        offset: 0.2, -0.0
      - time: 0.1
        offset: 0.3, -0.2
      - time: 0.2
        offset: 0.2, -1.2
        easing: QuadIn
      - time: 0.3
        offset: -0.1, -0.5
        easing: QuadOut

      rotationAnimation:
      - time: 0.0
        rotation: -20
      - time: 0.02
        rotation: -90
      - time: 0.07
        rotation: -180
      - time: 0.1
        rotation: -270
      - time: 0.2
        rotation: -360
      - time: 0.2
        rotation: -400

      colorAnimation:
      - time: 0.3
        color: "#ffffff"
      - time: 0.4
        color: "#ffffff00"  # Fade out
        easing: QuadOut

      scaleAnimation:
      - time: 0.0
        scale: 1, 1
    0.25:
    - !type:WeaponArcAttack
      range: 0.7
      arcWidth: 40
    - !type:Dash
      distance: 0.1
