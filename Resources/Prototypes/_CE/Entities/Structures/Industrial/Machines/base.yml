- type: entity
  abstract: true
  id: CEConstructibleMachine
  components:
  - type: Animateable
  - type: Machine
  - type: ContainerContainer
    containers:
      machine_board: !type:Container
      machine_parts: !type:Container
  - type: Construction
    graph: CEMachine
    node: machine
    containers:
    - machine_parts
    - machine_board
  - type: CEDamageable
  - type: CEDestructible
    destroyThreshold: 80
    destroySound:
      collection: MetalBreak

- type: entity
  abstract: true
  parent: BaseMachine
  id: CEBaseMachinePowered
  components:
  - type: ApcPowerReceiver
    powerLoad: 1
  - type: ExtensionCableReceiver
    receptionRange: 0

- type: entity
  abstract: true
  id: CEBaseMachineBigPipeConnectable
  components:
  - type: PlacementReplacement
    key: pipe_big
  - type: NodeContainer
    examinable: true
    nodes:
      input:
        !type:CableDeviceNode
        nodeGroupID: HVPower
      power:
        !type:CableNode
        nodeGroupID: HVPower