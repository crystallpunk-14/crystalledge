- type: entity
  id: CEWater
  name: water
  description: TODO
  categories: [ "ForkFiltered" ]
  placement:
    mode: SnapgridCenter
  components:
  - type: PlacementReplacement
    key: water
  - type: Clickable
  - type: Transform
    anchored: true
  - type: Sprite
    sprite: _CE/Structures/Nature/water.rsi
    state: static
    drawdepth: Puddles
    snapCardinals: true
  - type: SyncSprite
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      conveyor:
        shape: !type:PolygonShape
          vertices:
          - -0.50,-0.50
          - 0.50,-0.50
          - 0.50,0.50
          - -0.50,0.50
        layer:
        - ConveyorMask
        hard: False
  - type: FloorOccluder
  - type: SpeedModifierContacts
    walkSpeedModifier: 0.5
    sprintSpeedModifier: 0.5
  - type: FootstepModifier
    footstepSoundCollection:
      collection: FootstepWater
      params:
        volume: 8
  - type: CEWaterDistortion
  #- type: Conveyor
  #- type: Appearance
  #- type: GenericVisualizer
  #  visuals:
  #    enum.ConveyorVisuals.State:
  #      enum.ConveyorState.Off:
  #        Off: { state: static }
  #        Forward: { state: moving }

- type: entity
  parent: CEWater
  id: CEWaterMoving
  suffix: Moving
  components:
  - type: Sprite
    state: moving
    snapCardinals: false
