- type: entity
  id: CEFireTileBase
  abstract: true
  description: A scorching hot flame. You definitely shouldn't touch it just like that.
  categories: [ ForkFiltered ]
  placement:
    mode: SnapgridCenter
  components:
  - type: Clickable
  - type: PlacementReplacement
    key: fire
  - type: Sprite
    drawdepth: Mobs
    noRot: true
    sprite: _CE/Effects/fire_tile.rsi
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        hard: false
        shape:
          !type:PhysShapeAabb
          bounds: "-0.3,-0.3,0.3,0.3"
        density: 1000
        mask:
          - ItemMask
        layer:
          - SlipLayer
  - type: Transform
    anchored: true
  - type: AmbientSound
    enabled: true
    volume: -5
    range: 5
    sound:
      path: /Audio/Ambience/Objects/fireplace.ogg #TODO more aggressive sound
  - type: Appearance
  - type: CERandomTimedDespawn
    minLifetime: 20
    maxLifetime: 30

- type: entity
  parent: CEFireTileBase
  id: CEFireTileLow
  name: small fire
  components:
  - type: Sprite
    layers:
    - state: low_1
      shader: unshaded
      map: [ "fire" ]
  - type: TileEmission
    color: "#ff4800"
  - type: RandomSprite
    available:
    - fire:
        low_1: ""
        low_2: ""
        low_3: ""
  - type: AmbientSound
    volume: -15
  - type: CEFire
    intensity: Low


- type: entity
  parent: CEFireTileBase
  id: CEFireTileMedium
  name: medium fire
  components:
  - type: Sprite
    layers:
    - state: medium_1
      shader: unshaded
      map: [ "fire" ]
  - type: TileEmission
    color: "#ff8000"
  - type: RandomSprite
    available:
    - fire:
        medium_1: ""
        medium_2: ""
        medium_3: ""
  - type: SpawnOnDespawn
    prototype: CEFireTileLow
  - type: AmbientSound
    volume: -10
  - type: CEFire
    intensity: Medium

- type: entity
  parent: CEFireTileBase
  id: CEFireTileHigh
  name: large fire
  components:
  - type: Sprite
    layers:
    - state: high_1
      shader: unshaded
      map: [ "fire" ]
  - type: TileEmission
    color: "#ffd900"
  - type: RandomSprite
    available:
    - fire:
        high_1: ""
        high_2: ""
        high_3: ""
  - type: SpawnOnDespawn
    prototype: CEFireTileMedium
  - type: AmbientSound
    volume: -5
  - type: CEFire
    intensity: High
