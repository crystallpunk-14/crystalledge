- type: entity
  id: CEStatusEffectFear
  name: Fear
  description: Your heartbeat quickens.
  components:
  - type: CENegativeStatusEffect
  - type: StatusEffect
    whitelist:
      components:
      - CEMobState
  - type: StatusEffectAlert
    alert: CEFear
    vfx: CESteamEffect
  - type: CESpeedModifierStatusEffect
    speed: 0.5
  - type: Sprite
    drawdepth: Effects
    sprite: _CE/Effects/StatusEffects/curse.rsi
    noRot: true
    layers:
    - state: effect
      shader: unshaded
  - type: PointLight
    radius: 1.2
    energy: 1
    color: "#000000"
  - type: CEStatusEffectStack
    stackDelta: -1
    baseDuration: 4

- type: alert
  id: CEFear
  alertViewEntity: CEFearAlertSpriteView
  name: ce-alert-fear-name
  description: ce-alert-fear-desc
  icons:
  - sprite: _CE/Interface/fear.rsi
    state: 'skull'

- type: entity
  id: CEFearAlertSpriteView
  categories:
  - HideSpawnMenu
  components:
  - type: GenericCounterAlert
    centerGlyph: false
    hideLeadingZeroes: true
  - type: Sprite
    sprite: /Textures/Interface/Alerts/essence_counter.rsi
    layers:
    - sprite: _CE/Interface/fear.rsi
      state: skull
    - map:
      - "1"
      offset: 0.65, 0
    - map:
      - "10"
      offset: 0.45, 0
    - map:
      - "100"
      offset: 0.25, 0
