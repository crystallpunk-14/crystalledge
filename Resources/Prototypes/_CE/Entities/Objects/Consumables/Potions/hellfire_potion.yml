- type: entity
  id: CEConsumablePotionHellfire
  parent:
  - CEConsumablePotionBase
  - CEPotionMedium
  name: hellfire potion
  description: A vial of infernal flame tainted with dark magic. The label is scorched beyond recognition. Extinguishing it is impossible — the curse keeps it burning.
  components:
  - type: Sprite
    layers:
    - state: icon
    - state: fill
      color: "#7700cc"
    - sprite: _CE/Effects/StatusEffects/fire_status.rsi
      state: effect
      shader: unshaded
      color: "#aa44ff"
  - type: CEConsumable
    effects:
    - !type:ApplyStatusEffectStack
      statusEffect: CEStatusEffectFire
      amount: 6
    - !type:ApplyStatusEffectStack
      statusEffect: CEStatusEffectCurse
      amount: 4
    - !type:SpawnEntity
      spawns:
      - CEEffectHealingGeneric
  - type: CEDestructionEffect
    effects:
    - !type:CETileAffectArea
      tileEffect: CETileEffectCursedFire
      radius: 2
      maxStacks: 8
    - !type:SpawnEntity
      effectTarget: User
      spawns:
      - CEEffectPotionHellfire
    - !type:AreaEffect
      range: 2
      effects:
      - !type:Damage
        attackType: Ranged
        damage:
          types:
            Fire: 25
      - !type:ApplyStatusEffectStack
        statusEffect: CEStatusEffectCurse
        amount: 3
  - type: CEDestructible
  - type: PointLight
    color: "#7700cc"
    radius: 1.3
    energy: 10

- type: entity
  id: CEEffectPotionHellfire
  parent: CEBaseMagicImpact
  categories: [ HideSpawnMenu ]
  save: false
  components:
  - type: Sprite
    drawdepth: BelowMobs
    sprite: _CE/Effects/firewall_telegraphy.rsi
    layers:
    - state: effect
      shader: unshaded
      color: "#aa44ff"
  - type: PointLight
    color: "#7700cc"
    radius: 2
  - type: TimedDespawn
    lifetime: 2
  - type: LightBehaviour
    behaviours:
      - !type:PulseBehaviour
        interpolate: Linear
        maxDuration: 2
        startValue: 0
        endValue: 5.0
        property: Energy
        isLooped: false
        enabled: true
