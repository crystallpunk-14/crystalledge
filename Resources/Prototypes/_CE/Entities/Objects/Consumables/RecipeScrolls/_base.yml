- type: entity
  abstract: true
  id: CEBaseRecipeScroll
  categories: [ ForkFiltered ]
  parent: BaseItem
  name: knowledge scroll
  description: An ancient scroll containing knowledge of item creation. Read it to learn recipes.
  components:
  - type: Item
    size: Tiny
    sprite: _CE/Objects/Bureaucracy/paper.rsi
  - type: Sprite
    sprite: _CE/Objects/Bureaucracy/paper.rsi
    layers:
    - state: scrolls
  - type: CEConsumable
    singleUse: false
    useDelay: 1

- type: entity
  parent: CEBaseRecipeScroll
  id: CERecipeScrollConsumablePotionManaMedium
  components:
  - type: CEConsumable
    effects:
    - !type:LearnWorkbenchRecipes
      recipes:
      - CEConsumablePotionManaMedium
