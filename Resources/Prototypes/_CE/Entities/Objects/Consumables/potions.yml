# Base consumable potion
- type: entity
  id: CEConsumablePotionBase
  parent: BaseItem
  abstract: true
  categories: [ ForkFiltered ]
  components:
  - type: Item
    size: Small
  - type: Sprite
    sprite: Objects/Specific/Chemistry/vial.rsi
    state: vial
  - type: CEConsumable
    useDelay: 1.5

# Multi-charge healing potion — 3 charges, heals 5 HP each use, leaves empty vial
- type: entity
  id: CEConsumablePotionHealingMulti
  parent: CEConsumablePotionBase
  name: healing potion
  description: A vial of red liquid with multiple doses. Drink to restore health.
  components:
  - type: CEConsumable
    useDelay: 2
    replacementEntity: CEConsumablePotionEmpty
    effects:
    - !type:Heal
      amount: 5
    - !type:SpawnEntityOnTarget
      spawns:
      - CEEffectHealingGeneric
    useSound:
      path: /Audio/Items/drink.ogg
  - type: CEDestructionEffect
    range: 1
    whitelist:
      components:
      - CEMobState
    effects:
    - !type:Heal
      amount: 3
    - !type:SpawnEntityOnTarget
      spawns:
      - CEEffectHealingGeneric
    - !type:SpawnEntityOnUser
      spawns:
      - CEEffectAreaHealingEffect
  - type: CEDamageable
  - type: CEDamageOnLand
    damage:
      types:
        Physical: 1
  - type: CEDestructible
    destroyThreshold: 1
    destroySound:
      collection: GlassBreak

# Empty potion vial (trash left after a multi-charge potion)
- type: entity
  id: CEConsumablePotionEmpty
  parent: BaseItem
  name: empty vial
  description: An empty glass vial.
  categories: [ ForkFiltered ]
  components:
  - type: Item
    size: Small
  - type: Sprite
    sprite: Objects/Specific/Chemistry/vial.rsi
    state: icon_empty
