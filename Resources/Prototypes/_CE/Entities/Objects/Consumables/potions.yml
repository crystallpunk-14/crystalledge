# Base consumable potion
- type: entity
  id: CEPotionBase
  parent: BaseItem
  abstract: true
  categories: [ ForkFiltered ]
  name: empty vial
  description: A potion was poured here once. Or will be. Who knows?
  components:
  - type: Item
    size: Tiny
  - type: Sprite
    sprite: _CE/Objects/Consumable/Potions/medium_bottle.rsi
  - type: CEDamageable
  - type: CEDamageOnLand
    damage:
      types:
        Physical: 1
  - type: CEDestructible
    destroyThreshold: 1
    destroySound:
      collection: GlassBreak
    lootTable: !type:AllSelector
      children:
      - id: CEGlassShard
        amount: 1

- type: entity
  id: CEConsumablePotionBase
  parent: CEPotionBase
  abstract: true
  components:
  - type: CEConsumable
    whitelist:
      components:
      - CEMobState
    replacementEntity: CEPotionEmpty
    useDelay: 1.5
    useSound:
      path: /Audio/Items/drink.ogg
  - type: CEDestructionEffect
    range: 1
    whitelist:
      components:
      - CEMobState

- type: entity
  id: CEGlassShard
  parent: BaseItem
  name: glass shard
  description: Sharp pieces of glass. Don't step on it!
  categories: [ ForkFiltered ]
  components:
  - type: Item
    size: Tiny
  - type: Sprite
    sprite: _CE/Objects/Consumable/Potions/shards.rsi
    layers:
    - state: shard1
      map: [ "random" ]
  - type: Appearance
  - type: RandomSprite
    available:
      - random:
          shard1: ""
          shard2: ""



- type: entity
  id: CEConsumablePotionHealing
  parent: CEConsumablePotionBase
  name: healing potion
  description: A simple healing potion. Drink it, or throw it at whoever you want to see get well.
  components:
  - type: Sprite
    layers:
    - state: fill
      color: "#b63d1f"
    - state: icon
  - type: CEConsumable
    effects:
    - !type:Heal
      amount: 10
    - !type:SpawnEntityOnTarget
      spawns:
      - CEEffectHealingGeneric
  - type: CEDestructionEffect
    effects:
    - !type:Heal
      amount: 5
    - !type:SpawnEntityOnTarget
      spawns:
      - CEEffectHealingGeneric
  - type: CEDestructible
    vfx:
    - CEEffectAreaHealingEffect

- type: entity
  id: CEConsumablePotionMana
  parent: CEConsumablePotionBase
  name: mana potion
  description: TODO
  components:
  - type: Sprite
    layers:
    - state: fill
      color: "#1f36b6"
    - state: icon
  - type: CEConsumable
    effects:
    - !type:RestoreMana
      amount: 10
    - !type:SpawnEntityOnTarget
      spawns:
      - CEEffectHealingGeneric
  - type: CEDestructionEffect
    effects:
    - !type:RestoreMana
      amount: 5
    - !type:SpawnEntityOnTarget
      spawns:
      - CEEffectHealingGeneric
  - type: CEDestructible
    vfx:
    - CEEffectAreaHealingEffect

# Empty potion vial (trash left after a multi-charge potion)
- type: entity
  id: CEPotionEmpty
  parent: CEPotionBase
  components:
  - type: Sprite
    sprite: _CE/Objects/Consumable/Potions/medium_bottle.rsi
    layers:
    - state: icon
