- type: entity
  abstract: true
  id: CEBaseWeaponSword
  categories: [ ForkFiltered ]
  parent:
  - BaseItem
  #- CEBaseWeaponDestructible
  #- CEBaseWeaponSelfDamage
  #- CEBaseWeaponSharp
  components:
  - type: Item
    size: Ginormous
  - type: CEItemAnimation
    animations:
      Primary: SwordAttack1
      Secondary: SwordAttack2
  - type: Clothing
    slots:
    - neck
    equipWhileMoving: true
    equipDelay: 1
    unequipDelay: 1
  - type: CEMeleeWeapon
    damage:
      types:
        Slash: 2

- type: animationAction
  id: SwordAttack1
  movementSpeed: 0.3
  lockRotation: true
  duration: 0.3
  events:
    0:
    - !type:Dash
      distance: 0.2
    0.1:
    - !type:ArcAttack
      range: 0.5
      arcWidth: 120
    - !type:ItemVisualEffect
      duration: 0.4
      fadeOut: true
      followUser: true
      offset: 1.0
      spriteRotation: -90

- type: animationAction
  id: SwordAttack2
  movementSpeed: 0.3
  lockRotation: true
  duration: 1.0
  events:
    0.2:
    - !type:Dash
      distance: 4.5
    0.3:
    - !type:ArcAttack
      range: 0.5
      arcWidth: 360
    0.4:
    - !type:ArcAttack
      range: 0.5
      arcWidth: 360
    0.5:
    - !type:ArcAttack
      range: 0.5
      arcWidth: 360

