- type: entity
  abstract: true
  id: CEBaseWeaponSword
  categories: [ ForkFiltered ]
  parent:
  - BaseItem
  #- CEBaseWeaponDestructible
  #- CEBaseWeaponSelfDamage
  #- CEBaseWeaponSharp
  components:
  - type: Item
    size: Ginormous
  - type: CEItemAnimation
    animations:
      Primary:
      - SwordAttack1
      - SwordAttack2
      - SwordAttack3
      Secondary:
      - SwordAttackHeavy1
  - type: Clothing
    slots:
    - neck
    equipWhileMoving: true
    equipDelay: 1
    unequipDelay: 1
  - type: CEMeleeWeapon
    damage:
      types:
        Slash: 2

- type: animationAction
  id: SwordAttack1
  movementSpeed: 0.3
  lockRotation: true
  duration: 0.4
  events:
    0:
    - !type:Dash
      distance: 0.2
    - !type:ItemVisualEffect
      spriteRotation: -90
      duration: 0.5
      followUser: true

      offsetAnimation:
      - time: 0.0
        offset: -0.7, 0.1
        easing: QuadIn
      - time: 0.1
        offset: 0, -0.5
        easing: QuadOut
      - time: 0.25
        offset: 0.1, -0.3
        easing: QuadOut

      rotationAnimation:
      - time: 0.0
        rotation: 20
      - time: 0.2
        rotation: 20
      - time: 0.25
        rotation: 0

      colorAnimation:
      - time: 0.0
        color: "#ffffff"
        easing: Linear
      - time: 0.2
        color: "#ffffff"
        easing: QuadOut
      - time: 0.3
        color: "#ffffff0a"  # Fade out
    0.1:
    - !type:ArcAttack
      range: 0.5
      arcWidth: 120

- type: animationAction
  id: SwordAttack2
  movementSpeed: 0.3
  lockRotation: true
  duration: 0.4
  events:
    0:
    - !type:Dash
      distance: 0.2
    - !type:ItemVisualEffect
      spriteRotation: -90
      duration: 0.5
      followUser: true

      offsetAnimation:
      - time: 0.0
        offset: 0.7, 0.1
        easing: QuadIn
      - time: 0.1
        offset: 0, -0.5
        easing: QuadOut
      - time: 0.25
        offset: -0.1, -0.3
        easing: QuadOut

      rotationAnimation:
      - time: 0.0
        rotation: -20
      - time: 0.2
        rotation: -20
      - time: 0.25
        rotation: 0

      colorAnimation:
      - time: 0.0
        color: "#ffffff"
        easing: Linear
      - time: 0.2
        color: "#ffffff"
        easing: QuadOut
      - time: 0.3
        color: "#ffffff0a"  # Fade out
    0.1:
    - !type:ArcAttack
      range: 0.5
      arcWidth: 120


- type: animationAction
  id: SwordAttack3
  movementSpeed: 0.3
  lockRotation: true
  duration: 0.7
  events:
    0:
    - !type:ItemVisualEffect
      spriteRotation: -90
      duration: 0.5
      followUser: true

      offsetAnimation:
      - time: 0.0
        offset: -0.8, 0.1
        easing: QuadIn
      - time: 0.05
        offset: -0.6, -0.3
      - time: 0.1
        offset: 0, -0.7
        easing: QuadOut
      - time: 0.2
        offset: 0.6, -0.3
      - time: 0.4
        offset: 0.8, 0.1
        easing: QuadOut

      rotationAnimation:
      - time: 0.0
        rotation: -90
        easing: QuadIn
      - time: 0.25
        rotation: 0
      - time: 0.5
        rotation: 90

      colorAnimation:
      - time: 0.0
        color: "#ffffff"
        easing: Linear
      - time: 0.4
        color: "#ffffff"
        easing: QuadOut
      - time: 0.6
        color: "#ffffff01"  # Fade out
    0.1:
    - !type:Dash
      distance: 0.4
    - !type:ArcAttack
      range: 0.7
      arcWidth: 180

- type: animationAction
  id: SwordAttackHeavy1
  movementSpeed: 0.3
  lockRotation: true
  duration: 1.0
  events:
    0:
    - !type:ItemVisualEffect
      spriteRotation: -90
      duration: 1
      offset: 0
      followUser: true

      offsetAnimation:
      - time: 0.0
        offset: -0.7, -0.7
      - time: 0.35
        offset: -1, 0
      - time: 0.4
        offset: -0.7, -0.7
      - time: 0.45
        offset: 0, -1
      - time: 0.5
        offset: 0.7, -0.7
      - time: 0.65
        offset: 1, 0
      - time: 0.6
        offset: 0.7, 0.7
      - time: 0.65
        offset: 0, 1
      - time: 0.7
        offset: -0.7, 0.7
      - time: 0.75
        offset: -1, 0

      rotationAnimation:
      - time: 0.0
        rotation: -50
      - time: 0.35
        rotation: -90
      - time: 0.45
        rotation: 0
      - time: 0.55
        rotation: 90
      - time: 0.65
        rotation: 180
      - time: 0.75
        rotation: 270
#
      #colorAnimation:
      #- time: 0.0
      #  color: "#ffffff"
      #  easing: Linear
      #- time: 0.4
      #  color: "#ffffff"
      #  easing: QuadOut
      #- time: 0.6
      #  color: "#ffffff01"  # Fade out
    0.3:
    - !type:ArcAttack
      range: 0.5
      arcWidth: 360
    0.4:
    - !type:ArcAttack
      range: 0.5
      arcWidth: 360
    0.5:
    - !type:ArcAttack
      range: 0.5
      arcWidth: 360


- type: entity
  parent: CEBaseWeaponSword
  id: CEWeaponSwordIron
  name: iron sword
  description: A finely crafted sword favored by imperial officers. Its blade gleams with authority and tradition.
  components:
  - type: Sprite
    sprite: _CE/Objects/Weapons/Sword/iron.rsi
    state: icon
