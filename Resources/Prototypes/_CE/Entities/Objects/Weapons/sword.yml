- type: entity
  abstract: true
  id: CEBaseWeaponSword
  categories: [ ForkFiltered ]
  parent:
  - BaseItem
  #- CEBaseWeaponDestructible
  #- CEBaseWeaponSelfDamage
  #- CEBaseWeaponSharp
  components:
  - type: Item
    size: Ginormous
  - type: CEItemAnimation
    animations:
      Primary:
      - SwordAttack1
      - SwordAttack2
      #Secondary:
      #- SwordAttackHeavy1
  - type: Clothing
    slots:
    - neck
    equipWhileMoving: true
    equipDelay: 1
    unequipDelay: 1
  - type: CEMeleeWeapon
    damage:
      types:
        Slash: 2

- type: animationAction
  id: SwordAttack1
  movementSpeed: 0.3
  lockRotation: true
  duration: 0.4
  events:
    0:
    - !type:Dash
      distance: 0.2
    - !type:ItemVisualEffect
      spriteRotation: -90
      duration: 0.5
      followUser: true

      offsetAnimation:
      - time: 0.0
        offset: -0.7, 0.1
        easing: QuadIn
      - time: 0.1
        offset: 0, -0.5
        easing: QuadOut
      - time: 0.25
        offset: 0.1, -0.3
        easing: QuadOut

      rotationAnimation:
      - time: 0.0
        rotation: 20
      - time: 0.2
        rotation: 20
      - time: 0.25
        rotation: 0

      colorAnimation:
      - time: 0.0
        color: "#ffffff"
        easing: Linear
      - time: 0.2
        color: "#ffffff"
        easing: QuadOut
      - time: 0.3
        color: "#ffffff0a"  # Fade out
    0.1:
    - !type:ArcAttack
      range: 0.5
      arcWidth: 120

- type: animationAction
  id: SwordAttack2
  movementSpeed: 0.3
  lockRotation: true
  duration: 0.4
  events:
    0:
    - !type:Dash
      distance: 0.2
    - !type:ItemVisualEffect
      spriteRotation: -90
      duration: 0.5
      followUser: true

      offsetAnimation:
      - time: 0.0
        offset: 0.7, 0.1
        easing: QuadIn
      - time: 0.1
        offset: 0, -0.5
        easing: QuadOut
      - time: 0.25
        offset: -0.1, -0.3
        easing: QuadOut

      rotationAnimation:
      - time: 0.0
        rotation: -20
      - time: 0.2
        rotation: -20
      - time: 0.25
        rotation: 0

      colorAnimation:
      - time: 0.0
        color: "#ffffff"
        easing: Linear
      - time: 0.2
        color: "#ffffff"
        easing: QuadOut
      - time: 0.3
        color: "#ffffff0a"  # Fade out
    0.1:
    - !type:ArcAttack
      range: 0.5
      arcWidth: 120

- type: animationAction
  id: SwordAttackHeavy1
  movementSpeed: 0.3
  lockRotation: true
  duration: 1.0
  events:
    0.2:
    - !type:Dash
      distance: 4.5
    0.3:
    - !type:ArcAttack
      range: 0.5
      arcWidth: 360
    0.4:
    - !type:ArcAttack
      range: 0.5
      arcWidth: 360
    0.5:
    - !type:ArcAttack
      range: 0.5
      arcWidth: 360


- type: entity
  parent: CEBaseWeaponSword
  id: CEWeaponSwordIron
  name: iron sword
  description: A finely crafted sword favored by imperial officers. Its blade gleams with authority and tradition.
  components:
  - type: Sprite
    sprite: _CE/Objects/Weapons/Sword/iron.rsi
    state: icon
