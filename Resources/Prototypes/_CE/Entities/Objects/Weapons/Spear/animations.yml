- type: animationAction
  id: SpearAttackLight
  movementSpeed: 0.3
  duration: 0.35
  events:
    0:
    - !type:Dash
      distance: 0.3
    - !type:PlaySound
      sound:
        path: /Audio/_CE/Effects/Weapon/slash.ogg
    - !type:EntityAnimation
      offsetAnimation:
      - time: 0.0
        offset: 0, 0
        easing: QuadIn
      - time: 0.08
        offset: 0, -2
        easing: QuadOut
      - time: 0.25
        offset: 0, -0.3
        easing: QuadOut

      rotationAnimation:
      - time: 0.0
        rotation: 0
      - time: 0.08
        rotation: 0
      - time: 0.25
        rotation: 0

      colorAnimation:
      - time: 0.0
        color: "#ffffff"
        easing: Linear
      - time: 0.15
        color: "#ffffff"
        easing: QuadOut
      - time: 0.25
        color: "#ffffff00"

      scaleAnimation:
      - time: 0.0
        scale: 1, -1
    0.08:
    - !type:WeaponArcAttack
      range: 0.9
      arcWidth: 15


