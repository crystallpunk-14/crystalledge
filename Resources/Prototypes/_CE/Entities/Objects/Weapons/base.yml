- type: entity
  abstract: true
  id: CEBaseWeaponExecution
  categories: [ HideSpawnMenu, ForkFiltered ]
  components:
  - type: Execution
    internalMeleeExecutionMessage: "ce-execution-popup-melee-initial-internal"
    externalMeleeExecutionMessage: "ce-execution-popup-melee-initial-external"
    completeInternalMeleeExecutionMessage: "ce-execution-popup-melee-complete-internal"
    completeExternalMeleeExecutionMessage: "ce-execution-popup-melee-complete-external"
    internalSelfExecutionMessage: "ce-execution-popup-self-initial-internal"
    externalSelfExecutionMessage: "ce-execution-popup-self-initial-external"
    completeInternalSelfExecutionMessage: "ce-execution-popup-self-complete-internal"
    completeExternalSelfExecutionMessage: "ce-execution-popup-self-complete-external"
