# Test entity for CEEphemeralCollectableComponent.
# Floats in the world, restores 1 mana to any dungeon player that touches it
# (once per player), and despawns after 60 seconds.
- type: entity
  id: CESoulShard
  name: soul shard
  description: TODO
  categories: [ ForkFiltered ]
  components:
  - type: Clickable
  - type: InteractionOutline
  - type: Transform
    anchored: false
  - type: Sprite
    noRot: true
    drawdepth: Mobs
    sprite: _CE/Effects/soul.rsi
    layers:
    - state: effect
      shader: unshaded
  - type: PointLight
    color: "#61a7e1"
    radius: 1.5
    energy: 10
    netsync: false
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        hard: false
        layer: []
        mask:
        - MobLayer
  - type: CEEphemeralCollectable
    collectVfx: CEEffectSoulCollect
    collectSound:
      path: /Audio/_CE/Effects/soul_pickup.ogg
      params:
        variation: 0.03
    effects:
    - !type:AddSoul
      effectTarget: Target
      amount: 1
  - type: CEAutoFloatingVisuals
    animationTime: 1
    floatingStartOffset: "0.0,0.0"
    floatingOffset: "0.0,0.2"
  - type: TimedDespawn
    lifetime: 60


- type: entity
  id: CEEffectSoulCollect
  parent: CEBaseMagicImpact
  categories: [ HideSpawnMenu ]
  save: false
  components:
  - type: Sprite
    drawdepth: BelowMobs
    sprite: _CE/Effects/soul_collect.rsi
    layers:
    - state: effect
      shader: unshaded
  - type: PointLight
    color: "#61a7e1"
    radius: 2
  - type: TimedDespawn
    lifetime: 1.2
  - type: LightBehaviour
    behaviours:
      - !type:PulseBehaviour
        interpolate: Linear
        maxDuration: 1.2
        startValue: 0
        endValue: 5.0
        property: Energy
        isLooped: false
        enabled: true

# Pure visual particle used by the soul-transfer animation. Spawned client-side
# by CEClientSoulTransferAnimationSystem, never exists on the server. No physics,
# no networking, no interaction — just a sprite + light that gets moved by the
# animation system each frame.
- type: entity
  id: CESoulTransferParticle
  name: soul fragment
  save: false
  categories: [ HideSpawnMenu ]
  components:
  - type: Transform
    anchored: false
  - type: Sprite
    noRot: true
    drawdepth: Mobs
    sprite: _CE/Effects/soul.rsi
    layers:
    - state: effect
      shader: unshaded
  - type: PointLight
    color: "#61a7e1"
    radius: 1
    energy: 2
    netsync: false
