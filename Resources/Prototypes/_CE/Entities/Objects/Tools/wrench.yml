- type: entity
  id: CEWrench
  categories: [ ForkFiltered ]
  parent:
  - BaseItem
  name: wrench
  description: 'A common tool for assembly and disassembly. Remember: lefty latchy, righty removey.'
  components:
  - type: EmitSoundOnLand
    sound:
      path: /Audio/Items/wrench_drop.ogg
  - type: Tag
    tags:
    - Wrench
  - type: Sprite
    sprite: _CE/Objects/Tools/wrench.rsi
    state: icon
  - type: Item
    sprite: _CE/Objects/Tools/wrench.rsi
    storedRotation: -90
  - type: CEWeapon
    range: 0.8
    hitSound:
      collection: MetalThud
    effectSlots:
      OnHit:
      - !type:Damage
        attackType: Melee
        damage:
          types:
            Physical: 2
    animations:
      Primary:
      - anim: DaggerAttackLight1
      - anim: DaggerAttackLight2
  - type: Tool
    qualities:
      - Anchoring
    useSound:
      path: /Audio/Items/ratchet.ogg
  - type: PhysicalComposition
    materialComposition:
      CEIron: 7
