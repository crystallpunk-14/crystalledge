- type: entity
  parent: BaseItem
  id: CECrowbar
  categories: [ ForkFiltered ]
  name: crowbar
  description: A sturdy iron crowbar, useful for prying things open.
  components:
  - type: EmitSoundOnLand
    sound:
      path: /Audio/Items/crowbar_drop.ogg
  - type: CEWeapon
    range: 0.9
    hitSound:
      collection: MetalThud
    effectSlots:
      OnHit:
      - !type:Damage
        attackType: Melee
        damage:
          types:
            Physical: 8
    animations:
      Primary:
      - anim: SwordAttackLight1
      - anim: SwordAttackLight2
  - type: Tool
    qualities:
      - Prying
    useSound:
      path: /Audio/Items/crowbar.ogg
  - type: ToolTileCompatible
  - type: PhysicalComposition
    materialComposition:
      CEIron: 7
  - type: Prying
  - type: Sprite
    sprite: _CE/Objects/Tools/crowbar.rsi
    state: icon
  - type: Clothing
    sprite: _CE/Objects/Tools/crowbar.rsi
    quickEquip: false
    slots:
    - Belt
  - type: Item
    sprite: _CE/Objects/Tools/crowbar.rsi
    storedRotation: -90
    size: Normal
    shape:
    - 0,0,0,1
