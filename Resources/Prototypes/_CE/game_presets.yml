- type: entity
  id: CEDungeonRule
  parent: BaseGameRule
  components:
  - type: CEDungeonRule

- type: entity
  id: CEWorldGenRule
  parent: BaseGameRule
  components:
  - type: CEWorldGenRule
    config: CETestWorld

- type: gamePreset
  id: Roguelike
  name: ce-roguelike-title
  description: ce-roguelike-description
  showInVote: true
  maxPlayers: 100
  rules:
    - CEDungeonRule

- type: gamePreset
  id: OpenWorld
  name: ce-worldgen-title
  description: ce-worldgen-description
  showInVote: true
  maxPlayers: 100
  rules:
    - CEWorldGenRule

- type: gamePreset
  id: Secret
  alias:
    - secret
    - sekrit
  name: secret-title
  description: secret-description
  showInVote: true
  rules:
    - Secret

- type: weightedRandom
  id: Secret
  weights:
    Roguelike: 1
    WorldGen: 0 #Temporaly disabled

- type: gamePreset
  id: BaselineSandbox
  alias:
    - sandbox
  name: sandbox-title
  description: sandbox-description
  showInVote: false
  maxPlayers: 5
  rules:
    - Sandbox
