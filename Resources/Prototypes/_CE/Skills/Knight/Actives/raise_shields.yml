- type: skill
  parent: BaseKnightSkill
  id: RaiseShields
  effect: !type:AddAction
    action: CEActionSpellRaiseShields

- type: entity
  id: CEActionSpellRaiseShields
  parent: CEActionSpellBase
  name: Raise Shields
  description: You grant [color=#b2e3eb]35 physical shields[/color] to all creatures in a small area.
  components:
  - type: CEVisualizeRadiusTargetAction
  - type: CEVisualizeAoEZoneAction
    radius: 1.5
  - type: CEActionManaCost
    manaCost: 20
  - type: CEActionStaminaCost
    cost: 3
  - type: Action
    useDelay: 15
    icon:
      sprite: _CE/Skills/Knight/raise_shields.rsi
      state: icon
  - type: TargetAction
    range: 3
    interactOnMiss: false
  - type: WorldTargetAction
    event: !type:CEWorldTargetActionAnimationEvent
      animation: AnimationRaiseShields

- type: entityEffectAnimation
  id: AnimationRaiseShields
  movementSpeed: 0.5
  duration: 1.5
  events:
    0:
    - !type:SpawnEntity
      spawns:
      - CEEffectRaiseShieldsTelegraphy
    - !type:PlaySound
      sound:
        path: /Audio/Magic/forcewall.ogg
        params:
          pitch: 0.7
    1.0:
    - !type:AreaEffect
      range: 1.5
      affectCaster: true
      effects:
      - !type:ApplyStatusEffectStack
        statusEffect: CEStatusEffectTempShield
        amount: 35
        max: 35
