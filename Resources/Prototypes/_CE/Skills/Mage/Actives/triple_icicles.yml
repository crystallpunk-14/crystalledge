- type: skill
  parent: BaseMageSkill
  id: TripleIcicles
  effect: !type:AddAction
    action: CEActionTripleIcicles

- type: entity
  id: CEActionTripleIcicles
  parent: CEActionSpellBase
  name: Triple Icicles
  description: You unleash three icicles that deal [color=#30caf5]cold[/color] damage and [color=#30caf5]freeze[/color] the area on hit.
  components:
  - type: Sprite
    sprite: _CE/Skills/Mage/triple_icicles.rsi
    state: icon
  - type: CEVisualizeWideLineAction
    width: 2.5
    projectileMode: true
  - type: CEActionManaCost
    manaCost: 3
  - type: Action
    useDelay: 3
    icon:
      sprite: _CE/Skills/Mage/triple_icicles.rsi
      state: icon
  - type: TargetAction
    range: 20
  - type: WorldTargetAction
    event: !type:CEWorldTargetActionAnimationEvent
      animation: AnimationTripleIcicles

- type: entityEffectAnimation
  id: AnimationTripleIcicles
  movementSpeed: 0.3
  duration: 1.0
  lockRotation: true
  events:
    0:
    #- !type:EntityAnimation
    #  dummyEntity: CEEffectTripleIciclesCharge
    #  offsetAnimation:
    #  - time: 0.0
    #    offset: 0, 0.5
    #  - time: 0.8
    #    offset: 0, -1
    #0.8:
    - !type:ShootProjectile
      projectileSpeed: 10
      prototype: CEProjectileTripleIcicle
      projectileCount: 3
      spread: 0.2

- type: entity
  id: CEProjectileTripleIcicle
  name: triple icicle
  parent: BaseBullet
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _CE/Effects/cold_slowdown_status.rsi
    layers:
    - state: effect
      shader: unshaded
  - type: PointLight
    color: "#30caf5"
    radius: 1.8
    energy: 4.0
  - type: CEProjectile
    hitEffects:
    - !type:Damage
      damage:
        types:
          Cold: 2
    - !type:FreezeArea
      radius: 1.5
      maxStacks: 6