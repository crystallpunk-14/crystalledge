- type: skill
  parent: BaseMageSkill
  id: Fireblast
  effect: !type:AddAction
    action: CEActionFireblast

- type: entity
  id: CEActionFireblast
  parent: CEActionSpellBase
  name: Fireblast
  description: You hurl a fireball that explodes on impact, setting the ground and creatures [color=#ff8a05]on fire[/color].
  components:
  - type: Sprite
    sprite: _CE/Skills/Mage/fireblast.rsi
    state: icon
  - type: CEVisualizeWideLineAction
    width: 2.5
    projectileMode: true
  - type: CEActionManaCost
    manaCost: 3
  - type: Action
    useDelay: 3
    icon:
      sprite: _CE/Skills/Mage/fireblast.rsi
      state: icon
  - type: TargetAction
    range: 20
  - type: WorldTargetAction
    event: !type:CEWorldTargetActionAnimationEvent
      animation: AnimationFireblast

- type: entityEffectAnimation
  id: AnimationFireblast
  movementSpeed: 0.3
  duration: 1.0
  lockRotation: true
  events:
    0:
    - !type:EntityAnimation
      dummyEntity: CEEffectFireblastCharge
      offsetAnimation:
      - time: 0.0
        offset: 0, 0.5
      - time: 0.8
        offset: 0, -1
    0.8:
    - !type:ShootProjectile
      projectileSpeed: 8
      prototype: CEProjectileFireblast
      projectileCount: 1
      spread: 0

- type: entity
  id: CEEffectFireblastCharge
  parent: CEBaseMagicImpact
  categories: [ ForkFiltered ]
  suffix: VFX
  name: fireblast charge
  save: false
  components:
  - type: Sprite
    drawdepth: Effects
    sprite: _CE/Effects/fireball_charge.rsi
    layers:
    - state: effect
      shader: unshaded
  - type: PointLight
    color: "#ff8a05"
    radius: 2.5
  - type: TimedDespawn
    lifetime: 3
  - type: LightBehaviour
    behaviours:
      - !type:PulseBehaviour
        interpolate: Linear
        maxDuration: 3
        startValue: 0
        endValue: 5.0
        property: Energy
        isLooped: false
        enabled: true

- type: entity
  id: CEProjectileFireblast
  name: fireblast projectile
  parent: BaseBullet
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _CE/Effects/fireball.rsi
    layers:
    - state: effect
      shader: unshaded
  - type: PointLight
    color: "#ff9603"
    radius: 2.0
    energy: 5.0
  - type: CEProjectile
    hitEffects:
    - !type:Damage
      damage:
        types:
          Heat: 3
    - !type:IgniteArea
      radius: 2
      maxStacks: 3
