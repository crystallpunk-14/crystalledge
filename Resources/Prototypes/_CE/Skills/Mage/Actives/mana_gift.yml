- type: skill
  parent: BaseMageSkill
  id: ManaGift
  effect: !type:AddAction
    action: CEActionManaGift

- type: entity
  id: CEActionManaGift
  parent: CEActionSpellBase
  name: Mana Gift
  description: Restore [color=#3082f5]25 mana[/color] to the selected target
  components:
  - type: CEVisualizeRadiusTargetAction
  - type: CEVisualizeAoEZoneAction
    radius: 0.5
  - type: CEActionManaCost
    canModifyManacost: false
    manaCost: 25
  - type: Action
    useDelay: 2
    icon:
      sprite: _CE/Skills/Mage/mana_gift.rsi
      state: icon
  - type: TargetAction
    range: 1.5
    interactOnMiss: false
  - type: EntityTargetAction
    canTargetSelf: false
    whitelist:
      requireAll: true
      components:
      - Battery
    event: !type:CEEntityTargetActionAnimationEvent
      animation: AnimationManaGift

- type: entityEffectAnimation
  id: AnimationManaGift
  movementSpeed: 0.5
  duration: 0.5
  events:
    0:
    - !type:SpawnEntity
      spawns:
      - CEEffectManaRestore
    - !type:SayChat
      sentence: "Dare magis"
    0.45:
    - !type:SpawnEntity
      spawns:
      - CEEffectManaRestore
    - !type:RestoreMana
      amount: 25
