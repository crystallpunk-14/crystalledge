# Worldgen herringbone atlas.
# Each room is exactly one herringbone domino: 16x8 tiles, ChunkHeight=1 z-level.
# Rooms are placed flush against each other (no seam-filling); design edges so openings line up.

- type: zMap
  id: DunTest
  maps:
  - /Maps/_CE/Dungeon/DunTest/DunTest0.yml
  - /Maps/_CE/Dungeon/DunTest/DunTest1.yml
  components:
    - type: MapLight
      ambientLightColor: "#b0d138"

- type: dungeonRoomType
  id: CEWorldDungeonRoom
  color: "#606d60"

- type: dungeonRoom3d
  id: CEWorldDungeon_Room1
  roomType: CEWorldDungeonRoom
  size: 16, 8
  height: 1
  zLevelMap: DunTest
  offset: 2, 2

