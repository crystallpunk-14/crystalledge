# World recipes. The world has no fixed size — it is bounded only by what the plan paints.
# CETestWorld is generated automatically at round start (MVP).

- type: worldConfig
  id: CETestWorld
  mapComponents:
  - type: Gravity
    enabled: true
    inherent: true
  - type: MapLight
    ambientLightColor: "#9aa0b0"
  planSteps:
  - !type:CEPaintRect
    from: 0,0,0
    to: 11,11,5
    chunkType: CEWorldStoneWall
  - !type:CEPaintRect
    from: 1,1,0
    to: 10,10,4
    chunkType: CEWorldForest
