# Paintable chunk types. MVP: a single "full fill" generator kind.
# Each chunk is 8x8 tiles across 2 z-levels; the fill generator fills every cell of every level.

- type: worldChunkType
  id: CEWorldStoneFloor
  generator: !type:CEFillChunkGenerator
    fillTile: CEStone

- type: worldChunkType
  id: CEWorldStoneWall
  generator: !type:CEFillChunkGenerator
    fillTile: CEStone
    fillEntity: CEWallStone

# Herringbone-filled chunk: each chunk is half of a 16x8x2 domino room from the worldgen atlas pool.
- type: worldChunkType
  id: CEWorldForest
  generator: !type:CEHerringboneChunkGenerator
    roomPool: CEWorldForestRoom
  postProcess:
  - !type:CEEntitySwapWorldPostProcess
    source: CEWallStoneBrick
    target: CEWallStone
    chance: 0.15
  - !type:CEEntitySwapWorldPostProcess
    source: CEWallStoneBrick
    target: CEWallDirt
    chance: 0.05
  - !type:CEBiomeWorldPostProcess
    layers:
    - !type:BiomeTileLayer
      tile: CEDirt
      threshold: 0.15
      noise:
        seed: 0
        noiseType: OpenSimplex2
        fractalType: Ridged
        frequency: 0.05
        octaves: 3
        lacunarity: 1.8
        gain: 0.7
        domainWarpType: OpenSimplex2
        domainWarpAmp: 120
