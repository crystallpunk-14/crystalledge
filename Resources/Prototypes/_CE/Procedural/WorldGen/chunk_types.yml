# Paintable chunk types. MVP: a single "full fill" generator kind.
# Each chunk is 8x8 tiles across 2 z-levels; the fill generator fills every cell of every level.

- type: worldChunkType
  id: CEWorldStoneFloor
  generator: !type:CEFillChunkGenerator
    fillTile: CEStone

- type: worldChunkType
  id: CEWorldStoneWall
  generator: !type:CEFillChunkGenerator
    fillTile: CEStone
    fillEntity: CEWallStone

# Herringbone-filled chunk: each chunk is half of a 16x8x2 domino room from the worldgen atlas pool.
- type: worldChunkType
  id: CEWorldForest
  generator: !type:CEHerringboneChunkGenerator
    roomPool: CEWorldForestRoom
