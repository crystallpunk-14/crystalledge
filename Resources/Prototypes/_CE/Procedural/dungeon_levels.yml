# Example dungeon level prototypes using the CEDungeonSystem generator configs.

# A static dungeon level that loads a pre-made map file as-is.
- type: dungeonLevel
  id: CEDungeonTestStatic
  name: Test Static Dungeon
  stable: true
  config:
    !type:CEStaticMapConfig
    mapPath: /Maps/_CE/Dev/Dev0.yml

# A multi-z-level dungeon that creates a z-network from a zMap prototype.
- type: dungeonLevel
  id: CEDungeonTestZNetwork
  name: Test ZNetwork Dungeon
  stable: false
  config:
    !type:CEStaticZNetworkConfig
    zMapProto: DunTest

- type: dungeonLevel
  id: MossyTemple1
  stable: false
  exits:
    default: MossyTemple1 # Recursion for now
  config:
    !type:CEProceduralConfig
    corridorTile: CEStonebricks
    corridorWander: 0
    maxRoomSize: 16
    blessingCount:
      min: 0
      max: 0
    cycleCount:
      min: 1
      max: 2
    generalCount:
      min: 30
      max: 50
    components:
    - type: MapLight
      ambientLightColor: "#3d4444"
    - type: Gravity
      enabled: true
      inherent: true
    generalRooms:
      whitelist:
        requireAll: true
        tags:
        - CEDunGenMossyTemple
        - CEDunGenRoomGeneral
    exitRoom:
      whitelist:
        requireAll: true
        tags:
        - CEDunGenMossyTemple
        #- CEDunGenRoomExit
    entranceRooms:
      whitelist:
        requireAll: true
        tags:
        - CEDunGenMossyTemple
        #- CEDunGenRoomEntrance
    blessingRooms:
      whitelist:
        requireAll: true
        tags:
        - CEDunGenMossyTemple
        #- CEDunGenRoomBlessing
    deadEndRooms:
      whitelist:
        requireAll: true
        tags:
        - CEDunGenMossyTemple
        #- CEDunGenRoomDeadEnd
