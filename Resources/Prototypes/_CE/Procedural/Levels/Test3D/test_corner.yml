# Test prototype for 3D procedural generation.
# Three rooms forming a 3D corner: one hub at (0,0,0),
# one step up on Z at (0,0,1), one step right on X at (1,0,0).
- type: dungeonLevel
  id: Test3DCorner
  name: ce-dungeon-test-3d-corner-name
  config:
    !type:CEProceduralConfig3D
    generationPlan:
    - !type:Set
      pos: 0,0,0
      proto: MossyTempleGeneralRoom
    - !type:Set
      pos: -1,0,2
      proto: MossyTempleGeneralRoom
    - !type:Set
      pos: 1,0,0
      proto: MossyTempleGeneralRoom
    - !type:Connect
      pos1: 0,0,0
      pos2: -1,0,2
    - !type:Connect
      pos1: 0,0,0
      pos2: 1,0,0
    - !type:Fill
      from: 0,0,0
      to: 0,0,5
      proto: MossyTempleGeneralRoom
    - !type:Fill
      from: -2,-2,0
      to: 2,2,0
      proto: MossyTempleTreasureRoom
    - !type:AppendRandom
      proto: MossyTempleTreasureRoom
      connectTo: MossyTempleTreasureRoom
      count: 
        min: 50
        max: 50
      connectSide: true
      connectFloor: true
      connectRoof: true
